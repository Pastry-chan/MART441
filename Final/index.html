<head>
    <meta charset="UTF-8" />
    <title>Explore Game</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>

    <style>
        body {
            margin: 0;
            background: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: rgb(0, 0, 0);
        }

        .game-wrapper {
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        #game-container {
            width: 800px;
            height: 600px;

            margin: 0 auto;

            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .instructions {
            margin-top: 15px;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="game-wrapper">

        <h1>Interactive Art Final</h1>

    <div id="game-container"></div>  
    
         <div class="instructions">
            <p>
                Use the LEFT ← and RIGHT → arrow keys to move
            </p>
            <p>
                Press SPACE to jump
            </p>
            <p>
                Try to explore all the platforms without falling!
            </p>
        </div>
    </div>   


<script>

var config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
 parent: 'game-container', 
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },

    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

var player;
var platforms;
var cursors;
var gameOver = false;

var game = new Phaser.Game(config);

function preload ()
{
    this.load.image('sky', 'assets/background.png');
    this.load.image('front', 'assets/front.png');
    this.load.image('img', 'assets/plants.png');

    this.load.spritesheet('player', 'assets/catsprite.png',
        { frameWidth: 192, frameHeight: 288 });
}

function create ()
{

    this.physics.world.TILE_BIAS = 32;  
    this.physics.world.setBounds(0, -600, 3869, 1200);
    this.cameras.main.setBounds(0, -600, 3869, 1200);

    this.sky = this.add.image(400, 300, 'sky');
    this.sky.setScrollFactor(0);

    this.front = this.add.image(0, 600, 'front')
        .setOrigin(0, 1)
        
        .setDepth(1);

     this.img = this.add.image(0, 600, 'img')
        .setOrigin(0, 1)
    
        .setDepth(4);

    platforms = this.physics.add.staticGroup();

function addPlatform(x, y, w, h, color, alpha = 1) {
    let p = this.add.rectangle(x, y, w, h, color, alpha);

    this.physics.add.existing(p, true);
    p.body.setSize(w, h);
    p.setDepth(10);
    
    platforms.add(p);

    return p;
}
addPlatform.call(this, 525, 415, 575, 20, 0x00000000, 0);
addPlatform.call(this, 1150, 400, 250, 20, 0x00000000, 0);
addPlatform.call(this, 1610, 150, 425, 20, 0x00000000, 0);
addPlatform.call(this, 1975, 170, 350, 20, 0x00000000, 0);
addPlatform.call(this, 2380, 310, 200, 20, 0x00000000, 0);
addPlatform.call(this, 2687, 175, 230, 20, 0x00000000, 0);
addPlatform.call(this, 2987, 310, 180, 20, 0x00000000, 0);
addPlatform.call(this, 3330, 245, 150, 20, 0x00000000, 0);
addPlatform.call(this, 3180, -15, 150, 20, 0x00000000, 0);
addPlatform.call(this, 3500, -175, 200, 20, 0x00000000, 0);
addPlatform.call(this, 2675, -340, 950, 20, 0x00000000, 0);
addPlatform.call(this, 1775, -225, 800, 20, 0x00000000, 0);
addPlatform.call(this, 1100, -140, 500, 20, 0x00000000, 0);
addPlatform.call(this, 525, -60, 575, 20, 0x00000000, 0);
addPlatform.call(this, 62.5, 100, 125, 20, 0x00000000, 0);


    player = this.physics.add.sprite(690, 200, 'player');
    player.setBounce(0.2);
    player.setCollideWorldBounds(true);
    player.setDepth(3);
    player.body.setSize(60, 120);
    player.body.setOffset(60, 168);

    this.cameras.main.startFollow(player);

    this.physics.add.collider(player, platforms);

    cursors = this.input.keyboard.createCursorKeys();

    this.spaceKey = this.input.keyboard.addKey(
        Phaser.Input.Keyboard.KeyCodes.SPACE
    );

    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }),
        frameRate: 10,
        repeat: -1
    });

    this.anims.create({
        key: 'turn',
        frames: [{ key: 'player', frame: 4 }],
        frameRate: 20
    });

    this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('player', { start: 5, end: 8 }),
        frameRate: 10,
        repeat: -1
    });
}

function update ()
{
if (cursors.left.isDown)
    {
        player.setVelocityX(-160);
        player.anims.play('left', true);
    }
else if (cursors.right.isDown)
    {
        player.setVelocityX(160);
        player.anims.play('right', true);
    }
else
    {
        player.setVelocityX(0);
        player.anims.play('turn');
    }

if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && player.body.touching.down)
    {
        player.setVelocityY(-400);
        player.setVelocityX(300);
    }

if (player.y > 450)
{
    player.setPosition(690, 200);
    player.setVelocity(0, 0);
}
}

</script>

</body>
</html>
